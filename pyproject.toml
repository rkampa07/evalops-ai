[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops-ai"
version = "0.1.0"
description = "Evaluate AI application responses, detect regressions, and gate releases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
# Optional: local LLM generation/judging on Apple Silicon (scripts only; the API never loads models)
local-ai = ["mlx-lm>=0.32"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "httpx2>=2.13", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["evalops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["backend/evalops"]
